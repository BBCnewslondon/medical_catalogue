name: CCE CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Guidelines, Linting & Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          uv run ruff check .

      - name: Check Formatting with Ruff
        run: |
          uv run ruff format --check .

      - name: Static Type Checking with Mypy
        run: |
          uv run mypy

  test-and-migrations:
    name: Test Suite & Migrations (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cce_user
          POSTGRES_PASSWORD: cce_password
          POSTGRES_DB: cce_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Verify Alembic Migrations (Upgrade -> Downgrade -> Upgrade)
        env:
          DATABASE_URL: postgresql+psycopg://cce_user:cce_password@localhost:5432/cce_db
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Run Pytest Suite with Coverage Enforcement
        env:
          DATABASE_URL: postgresql+psycopg://cce_user:cce_password@localhost:5432/cce_db
        run: |
          uv run pytest -v --cov=cce --cov-report=term-missing --cov-report=xml

      - name: Upload Coverage Artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

